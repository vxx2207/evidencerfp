name: GitHub Pages · Demo

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Synthetische Demo bauen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Tests ausführen
        working-directory: frontend
        run: npm test -- --passWithNoTests

      - name: Demo ohne API und Upload bauen
        working-directory: frontend
        env:
          VITE_APP_MODE: demo
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Chromium für den Smoke-Test installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Gebautes Pages-Artefakt im Browser prüfen
        working-directory: frontend
        env:
          PLAYWRIGHT_USE_PREVIEW: "true"
        run: npm run test:e2e

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: GitHub Pages veröffentlichen
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
