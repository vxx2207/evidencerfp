name: CI

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Java 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Maven Wrapper ausführbar machen
        run: chmod +x mvnw

      - name: Backend testen
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Backend-OpenAPI-Vertrag erzwingen
        shell: bash
        run: |
          report="target/surefire-reports/TEST-com.certaaccess.evidencerfp.analysis.api.OpenApiContractTest.xml"
          test -f "$report"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          counts = {name: int(suite.attrib.get(name, "0"))
                    for name in ("tests", "errors", "failures", "skipped")}
          assert counts["tests"] == 1, f"OpenAPI-Vertragstest fehlt oder ist mehrdeutig: {counts}"
          assert counts["errors"] == counts["failures"] == counts["skipped"] == 0, counts
          PY

      - name: Ausführung der Production-Integrationstests erzwingen
        shell: bash
        run: |
          report="target/surefire-reports/TEST-com.certaaccess.evidencerfp.evidence.PgVectorEvidenceRetrieverIntegrationTest.xml"
          test -f "$report"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          counts = {name: int(suite.attrib.get(name, "0"))
                    for name in ("tests", "errors", "failures", "skipped")}
          assert counts["tests"] == 19, f"Erwartet werden exakt 19 Production-Integrationstests: {counts}"
          assert counts["errors"] == counts["failures"] == counts["skipped"] == 0, counts
          PY

      - name: Versionierten Qualitätsbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-rfp-evaluation
          path: |
            backend/target/evaluation/golden-set-report.json
            backend/target/evaluation/golden-set-report.html
          if-no-files-found: error

      - name: Testberichte bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-rfp-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

      - name: Optionale KI-Adapter kompilieren
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Pollama \
            -Dtest=EmbeddingProviderSupportTest,OllamaAnswerGeneratorProviderTest test
          ./mvnw --batch-mode --no-transfer-progress -Popenai clean compile -DskipTests

      - name: Optionales Ollama-Evaluationsprofil ohne Opt-in prüfen
        shell: bash
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Pollama-eval clean verify
          report="target/ollama-eval-build/failsafe-reports/TEST-com.certaaccess.evidencerfp.evaluation.OllamaGoldenSetEvaluationIT.xml"
          test -f "$report"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          counts = {name: int(suite.attrib.get(name, "0"))
                    for name in ("tests", "errors", "failures", "skipped")}
          assert counts == {"tests": 1, "errors": 0, "failures": 0, "skipped": 1}, counts
          PY

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktionsabhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high

      - name: OpenAPI-Client reproduzierbar generieren
        run: |
          npm run generate:api
          git diff --exit-code -- src/generated/api

      - name: Frontend testen
        run: npm test -- --passWithNoTests

      - name: Statische Demo bauen
        env:
          VITE_APP_MODE: demo
        run: npm run build

      - name: Chromium für den Smoke-Test installieren
        run: npx playwright install --with-deps chromium

      - name: Gebautes Demo-Artefakt im Browser prüfen
        env:
          PLAYWRIGHT_USE_PREVIEW: "true"
        run: npm run test:e2e

  repository-contract:
    name: Demo-Daten und Compose prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JSON und erwartete Anzahl prüfen
        shell: bash
        run: |
          jq empty examples/identity-snapshot.json examples/golden-set.json examples/rfp-questions.json
          test "$(jq '.questions | length' examples/golden-set.json)" -eq 20
          test "$(jq '[.questions[] | 1 + (.paraphrases | length)] | add' examples/golden-set.json)" -eq 80
          test "$(jq '.questions | length' examples/rfp-questions.json)" -eq 24
          test "$(find examples/source -maxdepth 1 -type f -name '*.md' ! -name 'rfp-fragen.md' | wc -l)" -eq 5
          test "$(grep -Ec '^\| RFP-[0-9]{3} \|' examples/source/rfp-fragen.md)" -eq 24

      - name: Docker Compose validieren
        run: docker compose config --quiet
