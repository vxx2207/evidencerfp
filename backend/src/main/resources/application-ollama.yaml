spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
          temperature: 0.1
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

evidence-rfp:
  ai:
    provider: ollama
    enabled: true
    chat-model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
