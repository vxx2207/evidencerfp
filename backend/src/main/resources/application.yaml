spring:
  application:
    name: evidence-rfp
  profiles:
    default: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null

server:
  address: 127.0.0.1
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: evidence-rfp

springdoc:
  swagger-ui:
    path: /swagger-ui.html

evidence-rfp:
  analysis:
    workers: 2
    queue-capacity: 4
    lease-seconds: 30
    heartbeat-seconds: 10
    max-attempts: 2
    recovery-batch-size: 8
    recovery-interval-ms: 5000
    recovery-initial-delay-ms: 1000
    storage-directory: ${ANALYSIS_STORAGE_DIRECTORY:${java.io.tmpdir}/evidence-rfp/jobs}
  uploads:
    max-file-bytes: 10485760
    max-total-bytes: 52428800
    max-evidence-files: 20
  documents:
    stale-after-days: 365
    max-pdf-pages: 200
    max-extracted-characters: 1000000
    max-chunks-per-file: 2000
    max-ooxml-expanded-bytes: 104857600
    max-ooxml-compression-ratio: 100
    max-ooxml-entries: 2000
    max-question-characters: 4000
    parser-timeout: 20s
  ai:
    provider: deterministic-demo
    enabled: false
    chat-model: deterministic-answer-v2
    embedding-model: none
    embedding-timeout-seconds: 30
    chat-timeout-seconds: 60
    max-retries: 2
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
