name: evidence-rfp

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evidence_rfp}
      POSTGRES_USER: ${POSTGRES_USER:-evidence_rfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evidence_rfp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - evidence-rfp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - evidence-rfp-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  evidence-rfp-postgres:
  evidence-rfp-ollama:
