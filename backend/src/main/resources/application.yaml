spring:
  application:
    name: evidence-rfp
  profiles:
    default: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

evidence-rfp:
  uploads:
    max-file-bytes: 10485760
    max-total-bytes: 52428800
    max-evidence-files: 20
  documents:
    stale-after-days: 365
  ai:
    provider: deterministic-demo
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
